<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Before and after Codespaces</title>
  <desc id="d">Before: every tool is installed by hand on the developer laptop and versions drift. After: the laptop is only a client connected to a GitHub Codespace cloud VM that holds Node, Python, Docker, PostgreSQL, Redis and SDKs.</desc>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .h { font-size: 13px; letter-spacing: 4px; font-weight: 700; }
    .ttl { font-size: 20px; font-weight: 700; fill: #e6edf3; }
    .sub { font-size: 13px; fill: #8b949e; }
    .nm { font-size: 16px; font-weight: 700; fill: #e6edf3; text-anchor: middle; }
    .tag { font-size: 12px; fill: #ff7b72; text-anchor: middle; }
    .bad { fill: #2d1517; stroke: #ff7b72; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .good { fill: #12261a; stroke: #7ee787; stroke-width: 1.5; }
  </style>
  <rect width="960" height="420" rx="18" fill="#0d1117"/>

  <!-- BEFORE -->
  <text class="h" x="30" y="50" fill="#ff7b72">BEFORE</text>
  <rect x="30" y="70" width="420" height="320" rx="14" fill="#161b22" stroke="#ff7b72" stroke-opacity="0.6"/>
  <text class="ttl" x="50" y="105">Developer Laptop</text>
  <text class="sub" x="50" y="128">every tool installed and maintained by hand</text>

  <rect class="bad" x="50"  y="150" width="180" height="56" rx="10"/>
  <text class="nm"  x="140" y="174">Node</text><text class="tag" x="140" y="194">v16? v20?</text>
  <rect class="bad" x="250" y="150" width="180" height="56" rx="10"/>
  <text class="nm"  x="340" y="174">Python</text><text class="tag" x="340" y="194">3.8? 3.12?</text>
  <rect class="bad" x="50"  y="222" width="180" height="56" rx="10"/>
  <text class="nm"  x="140" y="246">Docker</text><text class="tag" x="140" y="266">daemon not running</text>
  <rect class="bad" x="250" y="222" width="180" height="56" rx="10"/>
  <text class="nm"  x="340" y="246">PostgreSQL</text><text class="tag" x="340" y="266">port already in use</text>
  <rect class="bad" x="50"  y="294" width="180" height="56" rx="10"/>
  <text class="nm"  x="140" y="318">Redis</text><text class="tag" x="140" y="338">missing</text>
  <rect class="bad" x="250" y="294" width="180" height="56" rx="10"/>
  <text class="nm"  x="340" y="318">SDKs</text><text class="tag" x="340" y="338">outdated</text>
  <text class="sub" x="50" y="375" fill="#ff7b72">"works on my machine"</text>

  <!-- arrow -->
  <path d="M462 230 H492" stroke="#7ee787" stroke-width="4" stroke-linecap="round"/>
  <path d="M488 220 L502 230 L488 240 Z" fill="#7ee787"/>

  <!-- AFTER -->
  <text class="h" x="510" y="50" fill="#7ee787">AFTER</text>
  <rect x="600" y="66" width="240" height="56" rx="10" fill="#161b22" stroke="#58a6ff"/>
  <text x="720" y="90" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Developer Laptop</text>
  <text x="720" y="110" font-size="12" fill="#8b949e" text-anchor="middle">just a client</text>
  <path d="M720 122 V150" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="732" y="141" font-size="11" fill="#8b949e">browser · VS Code · SSH</text>

  <rect x="510" y="150" width="420" height="240" rx="14" fill="#161b22" stroke="#7ee787"/>
  <text x="530" y="180" font-size="18" font-weight="700" fill="#e6edf3">GitHub Codespace</text>
  <text class="sub" x="530" y="200">cloud VM · identical for everyone</text>

  <rect class="good" x="530" y="218" width="120" height="46" rx="10"/><text class="nm" x="590" y="247" font-size="15">Node</text>
  <rect class="good" x="660" y="218" width="120" height="46" rx="10"/><text class="nm" x="720" y="247" font-size="15">Python</text>
  <rect class="good" x="790" y="218" width="120" height="46" rx="10"/><text class="nm" x="850" y="247" font-size="15">Docker</text>
  <rect class="good" x="530" y="278" width="120" height="46" rx="10"/><text class="nm" x="590" y="307" font-size="15">PostgreSQL</text>
  <rect class="good" x="660" y="278" width="120" height="46" rx="10"/><text class="nm" x="720" y="307" font-size="15">Redis</text>
  <rect class="good" x="790" y="278" width="120" height="46" rx="10"/><text class="nm" x="850" y="307" font-size="15">SDKs</text>
  <text x="530" y="360" font-size="13" fill="#7ee787" font-family="Consolas, Menlo, monospace">versions pinned in .devcontainer/</text>
</svg>
